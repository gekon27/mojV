name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components/mojv
      - name: Validate School panel JavaScript
        run: node --check custom_components/mojv/frontend/school-panel.js
      - name: Check reserved naming
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = bytes([101,100,117,86,85,76,67,65,78]).decode().lower()
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text:
                  hits.append(str(path))
          if hits:
              raise SystemExit('Reserved naming found in: ' + ', '.join(hits))
          PY
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run unit tests
        run: pytest -q tests

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics
