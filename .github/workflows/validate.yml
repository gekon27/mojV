name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m compileall -q custom_components/mojv
      - name: Compile auth helper
        run: python -m compileall -q mojv_auth_helper/rootfs/app
      - name: Validate School panel JavaScript
        run: node --check custom_components/mojv/frontend/school-panel.js
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest aiohttp pyyaml
      - name: Validate repository and app YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          repository = yaml.safe_load(Path('repository.yaml').read_text(encoding='utf-8'))
          app = yaml.safe_load(Path('mojv_auth_helper/config.yaml').read_text(encoding='utf-8'))
          assert repository['url'] == 'https://github.com/gekon27/mojV'
          assert app['slug'] == 'mojv_auth_helper'
          assert app['ingress'] is False
          assert app['image'] == 'ghcr.io/gekon27/mojv-auth-helper'
          assert not app.get('ports')
          assert not app.get('ports_description')
          PY
      - name: Check release version consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(
              Path('custom_components/mojv/manifest.json').read_text(encoding='utf-8')
          )['version']
          readme = Path('README.md').read_text(encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')

          if f'HACS {version}' not in readme:
              raise SystemExit(f'README version does not match manifest: {version}')
          if f'## [{version}]' not in changelog:
              raise SystemExit(f'CHANGELOG version does not match manifest: {version}')
          PY
      - name: Check reserved naming
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = bytes([101,100,117,86,85,76,67,65,78]).decode().lower()
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text:
                  hits.append(str(path))
          if hits:
              raise SystemExit('Reserved naming found in: ' + ', '.join(hits))
          PY
      - name: Run unit tests
        run: pytest -q tests

  helper-image:
    name: Auth helper image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read helper version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: "\([^"]*\)"/\1/p' mojv_auth_helper/config.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build helper image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} \
            --build-arg BUILD_ARCH=amd64 \
            -t mojv-auth-helper:test \
            mojv_auth_helper
      - name: Start helper image
        run: docker run -d --name mojv-auth-helper-test -p 18099:8099 mojv-auth-helper:test
      - name: Wait for helper readiness
        run: |
          set -e
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18099/health > /tmp/helper-health.json; then
              exit 0
            fi
            sleep 1
          done
          docker logs mojv-auth-helper-test || true
          exit 1
      - name: Smoke-test Xvfb and Chromium
        run: |
          docker exec mojv-auth-helper-test sh -c '
            set -e
            ps | grep "[X]vfb"
            test -n "$DISPLAY"
            BROWSER="$(command -v chromium-browser || command -v chromium)"
            test -n "$BROWSER"
            command -v chromedriver
            "$BROWSER" --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/browser-smoke.html
            test -s /tmp/browser-smoke.html
          '
      - name: Smoke-test helper health and version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          curl --fail --silent --show-error http://127.0.0.1:18099/health > /tmp/helper-health.json
          cat /tmp/helper-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/helper-health.json').read_text(encoding='utf-8'))
          assert payload['status'] == 'ok'
          assert payload['version'] == os.environ['EXPECTED_VERSION']
          PY
      - name: Show helper logs on failure
        if: failure()
        run: docker logs mojv-auth-helper-test || true
      - name: Stop helper image
        if: always()
        run: docker rm -f mojv-auth-helper-test || true

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics
