name: Publish auth helper

on:
  push:
    branches:
      - main
    paths:
      - mojv_auth_helper/**
      - .github/workflows/publish-helper.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gekon27/mojv-auth-helper

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read helper version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: "\([^"]*\)"/\1/p' mojv_auth_helper/config.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./mojv_auth_helper
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=amd64
          tags: ${{ env.IMAGE }}:amd64-${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gekon27/mojV

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: ./mojv_auth_helper
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=aarch64
          tags: ${{ env.IMAGE }}:aarch64-${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gekon27/mojV

      - name: Publish multi-arch manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:aarch64-${VERSION}"

      - name: Inspect published image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Verify anonymous pull
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker logout ghcr.io || true
          rm -f "$HOME/.docker/config.json"
          docker pull "${IMAGE}:${VERSION}"
